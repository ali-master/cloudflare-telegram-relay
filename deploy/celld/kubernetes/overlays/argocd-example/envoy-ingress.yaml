apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-celld-envoy-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app: relay-celld
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: example-gateway
              gateway.envoyproxy.io/owning-gateway-namespace: gateway-system
      ports:
        - port: 8080
          protocol: TCP
