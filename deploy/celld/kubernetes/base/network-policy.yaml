apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-celld-ingress
  labels:
    relay-deploy-phase: configuration
spec:
  podSelector:
    matchLabels:
      app: relay-celld
  policyTypes: [Ingress]
  ingress:
    # Only explicitly labelled ingress/proxy Pods can reach the Worker listener.
    - from:
        - podSelector:
            matchLabels:
              relay-celld-client: "true"
      ports:
        - port: 8080
          protocol: TCP
    # The unauthenticated operator API must stay inside the trusted fleet.
    - from:
        - podSelector:
            matchLabels:
              app: relay-celld
      ports:
        - port: 8081
          protocol: TCP
