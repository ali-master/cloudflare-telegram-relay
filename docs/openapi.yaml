      description: "Uses title, message, status, commonLabels, and externalURL; individual alert details are not expanded. Selected strings are truncated to normalized limits. API-key authentication is required; Grafana HMAC signatures are not verified. Requires an application key belonging to the selected tenant. Master admin keys are rejected."
      parameters:
