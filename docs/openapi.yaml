  "/api/v1/tenants/{tenantId}/integrations/alertmanager":
    post:
      operationId: "ingestAlertmanagerForTenant"
      summary: "Expand a native Alertmanager webhook into 1–20 notifications"
      tags:
        ["Producer API"]
      security:
        -
          bearerAuth:
            []
        -
          apiKeyHeader:
            []
      responses:
        "202":
          description: "Accepted records; duplicates are indicated per record."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BatchAcceptance"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          description: "Idempotency-Key already belongs to a different normalized notification."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
      description: "Maps each alert separately and truncates selected text fields. Resolved alerts use success severity. Batch enqueue is sequential, not atomic: a later error can occur after earlier records were accepted. A retry without Idempotency-Key can create duplicates. When using a key, preserve the alerts array order and payload. Alertmanager's native receiver does not supply a unique event key by default. Requires an application key belonging to the selected tenant. Master admin keys are rejected."
      parameters:
        -
          name: "tenantId"
          in: "path"
          required: true
          schema:
            type: "string"
            pattern: "^[a-z0-9][a-z0-9_-]{1,47}$"
          description: "Tenant ID. The default tenant is named default."
        -
          name: "Idempotency-Key"
          in: "header"
          required: false
          description: "Key scoped to the authenticated application in this tenant. Identical normalized retries reuse a record; changed content returns 409. Omitted timestamps stay stable. Keys become reusable when retention cleanup selects the terminal record. Alertmanager appends array index, so preserve order."
          schema:
            type: "string"
            pattern: "^[A-Za-z0-9_.:-]{1,128}$"
            maxLength: 128
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AlertmanagerWebhook"
