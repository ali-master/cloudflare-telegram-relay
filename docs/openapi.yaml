# OpenAPI 3.1 contract for the implemented relay endpoints.
openapi: "3.1.0"
info:
  title: "Telegram Relay API"
  version: "1.0.0"
  description: "Multi-tenant Telegram notification gateway. Each tenant has an isolated bot, audience, queue, access policy, quotas, and applications. Producers use an APPLICATION API key in Authorization: Bearer or X-API-Key. The master API_KEY is for admin login only. The header key binds application identity and display name. Explicit routes use /api/v1/tenants/{tenantId}; /api/v1 is the default-tenant alias. Producers share the tenant minute quota across applications/IPs. Admin login creates an 8-hour HttpOnly session; admin mutations require an exact Origin header. All JSON bodies are capped at 64 KiB. Acceptance is not proof of Telegram delivery."
servers:
  -
    url: "/"
    description: "The current deployed relay origin."
tags:
  -
    name: "Producer API"
    description: "Application-authenticated tenant ingestion and own-application status."
  -
    name: "Administration"
    description: "Master-key session, tenants, bots, applications, policies, bans, quotas, and reports."
  -
    name: "Telegram"
    description: "Telegram-owned subscription callback."
  -
    name: "Health"
    description: "Basic runtime routing health."
paths:
  "/health":
    get:
      operationId: "health"
      summary: "Worker routing health (does not contact Telegram)"
      tags:
        ["Health"]
      security:
        []
      responses:
        "200":
          description: "Worker handler is responding."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  status:
                    const: "ok"
                  service:
                    const: "telegram-relay"
                required:
                  ["status","service"]
                additionalProperties: false
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
  "/api/v1/notifications":
    post:
      operationId: "createNotification"
      summary: "Broadcast to the current active subscriber snapshot"
      tags:
        ["Producer API"]
      security:
        -
          bearerAuth:
            []
        -
          apiKeyHeader:
            []
      responses:
        "200":
          description: "Existing idempotent request; no new broadcast was created."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Acceptance"
        "202":
          description: "Persisted for delivery; this does not prove Telegram delivery."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Acceptance"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          description: "Idempotency-Key already belongs to a different normalized notification."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
      parameters:
        -
          name: "Idempotency-Key"
          in: "header"
          required: false
          description: "Key scoped to the authenticated application in this tenant. Identical normalized retries reuse a record; changed content returns 409. Omitted timestamps stay stable. Keys become reusable when retention cleanup selects the terminal record. Alertmanager appends array index, so preserve order."
          schema:
            type: "string"
            pattern: "^[A-Za-z0-9_.:-]{1,128}$"
            maxLength: 128
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/NotificationInput"
      description: "This is the default-tenant compatibility route. Authentication requires a default-tenant application key; master admin keys are rejected."
  "/api/v1/notifications/{id}":
    get:
      operationId: "getNotification"
      summary: "Read a retained notification and aggregate delivery counts"
      tags:
        ["Producer API"]
      security:
        -
          bearerAuth:
            []
        -
          apiKeyHeader:
            []
      responses:
        "200":
          description: "Notification with current aggregate status; recipient identities are not included."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/NotificationDetail"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          description: "Notification not found or already removed by retention cleanup."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      description: "This is the default-tenant compatibility route. Authentication requires a default-tenant application key; master admin keys are rejected. The application can read only its own notification IDs; other IDs return 404."
  "/api/v1/integrations/alertmanager":
    post:
      operationId: "ingestAlertmanager"
      summary: "Expand a native Alertmanager webhook into 1–20 notifications"
      tags:
        ["Producer API"]
      security:
        -
          bearerAuth:
            []
        -
          apiKeyHeader:
            []
      responses:
        "202":
          description: "Accepted records; duplicates are indicated per record."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BatchAcceptance"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          description: "Idempotency-Key already belongs to a different normalized notification."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
      description: "Maps each alert separately and truncates selected text fields. Resolved alerts use success severity. Batch enqueue is sequential, not atomic: a later error can occur after earlier records were accepted. A retry without Idempotency-Key can create duplicates. When using a key, preserve the alerts array order and payload. Alertmanager's native receiver does not supply a unique event key by default. This is the default-tenant compatibility route. Authentication requires a default-tenant application key; master admin keys are rejected."
      parameters:
        -
          name: "Idempotency-Key"
          in: "header"
          required: false
          description: "Key scoped to the authenticated application in this tenant. Identical normalized retries reuse a record; changed content returns 409. Omitted timestamps stay stable. Keys become reusable when retention cleanup selects the terminal record. Alertmanager appends array index, so preserve order."
          schema:
            type: "string"
            pattern: "^[A-Za-z0-9_.:-]{1,128}$"
            maxLength: 128
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AlertmanagerWebhook"
  "/api/v1/integrations/grafana":
    post:
      operationId: "ingestGrafana"
      summary: "Normalize one native Grafana alert-group notification"
      tags:
        ["Producer API"]
      security:
        -
          bearerAuth:
            []
        -
          apiKeyHeader:
            []
      responses:
        "202":
          description: "Group notification accepted or found by idempotency key."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Acceptance"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          description: "Idempotency-Key already belongs to a different normalized notification."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
      description: "Uses title, message, status, commonLabels, and externalURL; individual alert details are not expanded. Selected strings are truncated to normalized limits. API-key authentication is required; Grafana HMAC signatures are not verified. This is the default-tenant compatibility route. Authentication requires a default-tenant application key; master admin keys are rejected."
      parameters:
        -
          name: "Idempotency-Key"
          in: "header"
          required: false
          description: "Key scoped to the authenticated application in this tenant. Identical normalized retries reuse a record; changed content returns 409. Omitted timestamps stay stable. Keys become reusable when retention cleanup selects the terminal record. Alertmanager appends array index, so preserve order."
          schema:
            type: "string"
            pattern: "^[A-Za-z0-9_.:-]{1,128}$"
            maxLength: 128
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/GrafanaWebhook"
  "/api/admin/login":
    post:
      operationId: "adminLogin"
      summary: "Exchange the environment API_KEY for an 8-hour admin session"
      tags:
        ["Administration"]
      security:
        []
      parameters:
        -
          name: "Origin"
          in: "header"
          required: true
          description: "Must exactly equal this deployment's origin, including scheme and port. Required for admin mutations and login."
          schema:
            type: "string"
            format: "uri"
            example: "https://relay.example.com"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                apiKey:
                  type: "string"
                  maxLength: 1024
                  minLength: 1
              required:
                ["apiKey"]
              additionalProperties: false
      responses:
        "200":
          description: "Authenticated; store the HttpOnly SameSite=Strict session cookie."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  authenticated:
                    const: true
                required:
                  ["authenticated"]
                additionalProperties: false
          headers:
            Set-Cookie:
              description: "__Host-relay_session on HTTPS (Secure; Path=/; HttpOnly; SameSite=Strict), relay_session on local HTTP."
              schema:
                type: "string"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
  "/api/admin/login-audit":
    get:
      operationId: "listLoginAudit"
      summary: "Read failed dashboard login attempts across the deployment"
      description: "Retains at most the latest 5000 attempts for 30 days. invalid_key means an incorrect or missing submitted key; rate_limited means the request was rejected before checking its key. Successful logins, malformed JSON, rejected origins, and unavailable authentication are not recorded. IP and country use trusted Cloudflare metadata; userAgent is bounded, self-reported text. Credentials, bodies, and cookies are excluded. Results are ordered newest first and offset pages can shift as new attempts arrive."
      tags: ["Administration"]
      security:
        - adminSession: []
        - localAdminSession: []
      parameters:
        - name: "limit"
          in: "query"
          schema: { type: "integer", minimum: 1, maximum: 100, default: 25 }
        - name: "offset"
          in: "query"
          schema: { type: "integer", minimum: 0, maximum: 5000, default: 0 }
        - name: "ip"
          in: "query"
          description: "Exact recorded IP match."
          schema: { type: "string", maxLength: 64 }
        - name: "country"
          in: "query"
          description: "Two-letter country code, normalized to uppercase. XX means unknown."
          schema: { type: "string", pattern: "^[A-Za-z]{2}$" }
        - name: "outcome"
          in: "query"
          schema: { type: "string", enum: ["invalid_key", "rate_limited"] }
      responses:
        "200":
          description: "Retained matching entries and pagination metadata."
          content:
            "application/json":
              schema:
                type: "object"
                required: ["entries", "total", "limit", "offset"]
                additionalProperties: false
                properties:
                  total: { type: "integer", minimum: 0, maximum: 5000 }
                  limit: { type: "integer", minimum: 1, maximum: 100 }
                  offset: { type: "integer", minimum: 0, maximum: 5000 }
                  entries:
                    type: "array"
                    maxItems: 100
                    items:
                      type: "object"
                      required: ["id", "createdAt", "ip", "country", "userAgent", "requestId", "outcome"]
                      additionalProperties: false
                      properties:
                        id: { type: "string", pattern: "^[0-9]+$" }
                        createdAt: { type: "string", format: "date-time" }
                        ip: { type: "string", maxLength: 64 }
                        country: { type: "string", pattern: "^[A-Z]{2}$" }
                        userAgent: { type: "string", maxLength: 512 }
                        requestId: { type: ["string", "null"], maxLength: 36 }
                        outcome: { type: "string", enum: ["invalid_key", "rate_limited"] }
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          description: "Authentication is temporarily unavailable; returns generic AUTH_UNAVAILABLE details."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/admin/session":
    get:
      operationId: "adminSession"
      summary: "Check whether the admin session remains valid"
      tags:
        ["Administration"]
      security: []
      responses:
        "200":
          description: "Session status. Missing, invalid, or expired cookies return authenticated=false without an HTTP authentication error."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  authenticated:
                    type: boolean
                required:
                  ["authenticated"]
                additionalProperties: false
        "400":
          "$ref": "#/components/responses/BadRequest"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
  "/api/admin/logout":
    post:
      operationId: "adminLogout"
      summary: "Clear the browser's session cookie"
      tags:
        ["Administration"]
      security:
        -
          adminSession:
            []
        -
          localAdminSession:
            []
      responses:
        "200":
          description: "Success."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  authenticated:
                    const: false
                required:
                  ["authenticated"]
                additionalProperties: false
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
      parameters:
        -
          name: "Origin"
          in: "header"
          required: true
          description: "Must exactly equal this deployment's origin, including scheme and port. Required for admin mutations and login."
          schema:
            type: "string"
            format: "uri"
            example: "https://relay.example.com"
  "/api/admin/context":
    get:
      operationId: "adminContext"
      summary: "Read the current request's source IP and country"
      tags:
        ["Administration"]
      security:
        -
          adminSession:
            []
        -
          localAdminSession:
            []
      responses:
        "200":
          description: "Success."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SourceContext"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
  "/api/admin/overview":
    get:
      operationId: "adminOverview"
      summary: "Read retained totals, seven daily UTC buckets, and recent notifications"
      tags:
        ["Administration"]
      security:
        -
          adminSession:
            []
        -
          localAdminSession:
            []
      responses:
        "200":
          description: "Success."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Overview"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
      description: "Counts derive from retained database records. Sent means Telegram accepted delivery, not that a subscriber read it. Welcome messages are excluded from notification delivery reports."
  "/api/admin/settings":
    get:
      operationId: "getSettings"
      summary: "Read current settings"
      tags:
        ["Administration"]
      security:
        -
          adminSession:
            []
        -
          localAdminSession:
            []
      responses:
        "200":
          description: "Success."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Settings"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
    put:
      operationId: "updateSettings"
      summary: "Merge and validate settings"
      tags:
        ["Administration"]
      security:
        -
          adminSession:
            []
        -
          localAdminSession:
            []
      responses:
        "200":
          description: "Success."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Settings"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
      parameters:
        -
          name: "Origin"
          in: "header"
          required: true
          description: "Must exactly equal this deployment's origin, including scheme and port. Required for admin mutations and login."
          schema:
            type: "string"
            format: "uri"
            example: "https://relay.example.com"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/SettingsUpdate"
  "/api/admin/subscribers":
    get:
      operationId: "listSubscribers"
      summary: "List private-chat subscribers"
      tags:
        ["Administration"]
      security:
        -
          adminSession:
            []
        -
          localAdminSession:
            []
      responses:
        "200":
          description: "Success."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SubscriberPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
      parameters:
        -
          name: "page"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 999999
            default: 1
          description: "One-based page; page size is fixed at 20."
  "/api/admin/notifications":
    get:
      operationId: "listNotifications"
      summary: "List retained notifications"
      tags:
        ["Administration"]
      security:
        -
          adminSession:
            []
        -
          localAdminSession:
            []
      responses:
        "200":
          description: "Success."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/NotificationPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/NotConfigured"
      parameters:
        -
          name: "page"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 999999
            default: 1
          description: "One-based page; page size is fixed at 20."
        -
          name: "level"
          in: "query"
          schema:
            type: "string"
            enum:
              ["info","success","warning","error","critical"]
        -
          name: "search"
          in: "query"
          schema:
            type: "string"
            maxLength: 100
          description: "Search application, event, or message text."
        -
          name: "applicationId"
          in: "query"
          schema:
            type: "string"
            maxLength: 48
          description: "Filter by stored application identity."
    post:
      operationId: "adminCreateNotification"
      summary: "Broadcast from the authenticated dashboard"
      tags:
        ["Administration"]
      security:
        -
          adminSession:
            []
        -
          localAdminSession:
            []
      responses:
        "202":
          description: "Accepted record or idempotent duplicate."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Acceptance"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          description: "Idempotency-Key already belongs to a different normalized notification."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
